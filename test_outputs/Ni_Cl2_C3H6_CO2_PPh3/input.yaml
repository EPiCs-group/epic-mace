# output directory
out_dir: ./
# Ni(Cl)2(eta2-C3H6)(CO)2(PPh3) - octahedral pi-complex test case
name: Ni_Cl2_C3H6_CO2_PPh3
geom: OH
res-structs: 1
# all donors carry :1 so MACE enumerates all OH stereoisomers
ligands:
  - "[Cl-:1]"
  - "[Cl-:1]"
  - "[*:1]([CH2])[CH]C"
  - "[C-:1]#[O+]"
  - "[C-:1]#[O+]"
  - "[P:1](c1ccccc1)(c1ccccc1)(c1ccccc1)"
CA: "[Ni+2]"
# stereomer-search
regime: CA
get-enantiomers: false
trans-cycle: no
mer-rule: true
# conformer-generation
num-confs: 10
rms-thresh: 0.5
# conformer post-processing
num-repr-confs: 1
e-rel-max: 25.0
drop-close-energy: true
