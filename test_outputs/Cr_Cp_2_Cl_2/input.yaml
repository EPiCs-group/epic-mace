# output directory
out_dir: ./test_outputs/Cr_Cp_2_Cl_2
# Cr(Cp)2Cl2 - tetrahedral coordination of two Cp centroids and two chlorides
name: Cr_Cp_2_Cl_2
geom: TET
res-structs: 1
# all donors carry :1 so MACE enumerates all distinct TET stereoisomers
ligands:
  - "[*:1][C-]1C=CC=C1"
  - "[*:1][C-]1C=CC=C1"
  - "[Cl-:1]"
  - "[Cl-:1]"
CA: "[Cr+4]"
# stereomer-search
regime: CA
get-enantiomers: false
trans-cycle: no
mer-rule: false
# conformer-generation
num-confs: 10
rms-thresh: 0.5
# conformer post-processing
num-repr-confs: 1
e-rel-max: 25.0
drop-close-energy: true
