# output directory
out_dir: ./
# [PtCl2(NH3)(eta2-C2H4)] - Zeise's-salt analogue, pi-complex test case
name: Pt_Cl2_NH3_C2H4
geom: SP
res-structs: 1
# all donors carry :1 so MACE does not pre-assign coordination positions;
# the CA stereomer search enumerates all distinct square-planar arrangements
ligands:
  - "[Cl-:1]"
  - "[Cl-:1]"
  - "[NH3:1]"
  - "[*:1]([CH2])[CH2]"
CA: "[Pt+2]"
# stereomer-search
regime: CA
get-enantiomers: false
trans-cycle: no
mer-rule: true
# conformer-generation
num-confs: 10
rms-thresh: 0.5
# conformer post-processing
num-repr-confs: 1
e-rel-max: 25.0
drop-close-energy: true
