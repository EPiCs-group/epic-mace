# output directory
out_dir: ./
# structure
name: Mn_PNP_CO_2_H2
geom: OH
res-structs: 1
ligands:
  - "CC(C)[P:1](C(C)C)CC[N:1]CC[P:1](C(C)C)C(C)C"
  - "[C-:1]#[O+]"
  - "[C-:1]#[O+]"
  - "[*:1]([H])[H]"
CA: "[Mn]"
# stereomer-search
regime: all
get-enantiomers: true
trans-cycle: no
mer-rule: true
# conformer-generation
num-confs: 3
rms-thresh: 1.0
# conformer post-processing
num-repr-confs: 3
e-rel-max: 25.0
drop-close-energy: true